name: Build extension bundle

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run bundle:extension

      - uses: actions/upload-artifact@v4
        with:
          name: url-webhook-clipper
          path: dist-zip/*.zip
